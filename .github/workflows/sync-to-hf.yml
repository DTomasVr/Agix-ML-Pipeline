name: Sincronizar con el Space de Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Subir main al Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "Falta el secreto HF_TOKEN"; exit 1; }
          git push --force "https://AgixApp:${HF_TOKEN}@huggingface.co/spaces/AgixApp/agix-app" HEAD:main
